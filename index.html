<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insta Tips</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .tip {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📸 Insta Tips</h1>

    <div class="card">
      <h2>Grow Your Instagram</h2>
      <p>Get simple tips to improve your Instagram content.</p>

      <button onclick="showTip()">Show a Tip</button>

      <div class="tip" id="tip">
        Post consistently, create useful content, and engage genuinely with your audience.
      </div>
    </div>

    <div class="card">
      <h3>Today's Tip</h3>
      <p>Use clear captions and relevant hashtags.</p>
    </div>
  </div>

  <script>
    function showTip() {
      document.getElementById("tip").style.display = "block";
    }
  </script>

</body>
</html>
